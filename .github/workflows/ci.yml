name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with web and test extras
        run: pip install -e ".[web,dev]"
      - name: Run tests
        run: pytest tests/ -q
      - name: Lint probe bank
        run: self-awaken lint-probes --probes data/probes --strict
